# Placeholders are substituted before apply; see docs/two-workload-deployment.md.
# This manifest deliberately runs the diagnostic and remediation agents separately.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-ops-diagnostic
  namespace: agentic-ops
  annotations:
    azure.workload.identity/client-id: "${DIAGNOSTIC_AZURE_CLIENT_ID}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-ops-remediation
  namespace: agentic-ops
  annotations:
    azure.workload.identity/client-id: "${REMEDIATION_AZURE_CLIENT_ID}"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-ops-diagnostic
  namespace: ${MANAGED_NAMESPACE}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets", "deployments"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agentic-ops-remediation
  namespace: ${MANAGED_NAMESPACE}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-ops-diagnostic
  namespace: ${MANAGED_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: agentic-ops-diagnostic
    namespace: agentic-ops
roleRef:
  kind: Role
  name: agentic-ops-diagnostic
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agentic-ops-remediation
  namespace: ${MANAGED_NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: agentic-ops-remediation
    namespace: agentic-ops
roleRef:
  kind: Role
  name: agentic-ops-remediation
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-ops-remediation
  namespace: agentic-ops
spec:
  selector:
    app: agentic-ops
    role: remediation
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentic-ops-diagnostic-ingress
  namespace: agentic-ops
spec:
  podSelector:
    matchLabels:
      app: agentic-ops
      role: diagnostic
  policyTypes: ["Ingress"]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agentic-ops-remediation-ingress
  namespace: agentic-ops
spec:
  podSelector:
    matchLabels:
      app: agentic-ops
      role: remediation
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: agentic-ops
              role: diagnostic
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ops-diagnostic
  namespace: agentic-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentic-ops
      role: diagnostic
  template:
    metadata:
      labels:
        app: agentic-ops
        role: diagnostic
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: agentic-ops-diagnostic
      securityContext:
        runAsNonRoot: true
      containers:
        - name: diagnostic-agent
          image: "${AGENTIC_OPS_IMAGE}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: AGENTIC_OPS_ROLE
              value: diagnostic
            - name: AGENTIC_OPS_NAMESPACE
              value: "${MANAGED_NAMESPACE}"
            - name: AGENTIC_OPS_ALLOWED_REGISTRIES
              value: "${ACR_LOGIN_SERVER}"
            - name: AZURE_AI_FOUNDRY_ENDPOINT
              value: "${AZURE_AI_FOUNDRY_ENDPOINT}"
            - name: AZURE_AI_FOUNDRY_DEPLOYMENT
              value: "${AZURE_AI_FOUNDRY_DEPLOYMENT}"
            - name: AGENTIC_OPS_REMEDIATION_URL
              value: http://agentic-ops-remediation.agentic-ops.svc.cluster.local:8080
            - name: AGENTIC_OPS_REMEDIATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentic-ops-remediation
                  key: token
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-ops-remediation
  namespace: agentic-ops
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: agentic-ops
      role: remediation
  template:
    metadata:
      labels:
        app: agentic-ops
        role: remediation
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: agentic-ops-remediation
      securityContext:
        runAsNonRoot: true
      containers:
        - name: remediation-agent
          image: "${AGENTIC_OPS_IMAGE}"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          env:
            - name: AGENTIC_OPS_ROLE
              value: remediation
            - name: AGENTIC_OPS_NAMESPACE
              value: "${MANAGED_NAMESPACE}"
            - name: AGENTIC_OPS_ALLOWED_REGISTRIES
              value: "${ACR_LOGIN_SERVER}"
            - name: AGENTIC_OPS_REMEDIATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: agentic-ops-remediation
                  key: token
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}


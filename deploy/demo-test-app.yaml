# Demo workload with a deliberate typo in the image name: "tset-app" instead of "test-app".
# The agent should detect ImagePullBackOff, verify the corrected image exists in ACR and patch the Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: ${MANAGED_NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
        - name: api
          image: "${ACR_LOGIN_SERVER}/tset-app:1.4.2"
          ports:
            - containerPort: 80

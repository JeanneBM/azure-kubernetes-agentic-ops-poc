name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Tests, SAST and dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install project and scanners
        run: |
          python -m pip install -c constraints.txt -e '.[dev]'
          python -m pip install bandit==1.8.6 pip-audit==2.9.0
          mkdir -p reports
          python -m pip freeze --exclude-editable > reports/resolved-dependencies.txt
      - name: Unit tests (no Azure connection)
        run: python -m pytest -q
      - name: SAST (medium/high severity and confidence)
        if: ${{ !cancelled() }}
        run: python -m bandit -r src -ll -ii -f json -o reports/bandit.json
      - name: Audit all resolved Python dependencies
        if: ${{ !cancelled() }}
        run: python -m pip_audit -r reports/resolved-dependencies.txt --no-deps --disable-pip --format json --output reports/pip-audit.json
      - name: Preserve reports, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-security-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14
  trivy:
    name: Secrets, IaC and container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install verified Trivy binary
        env:
          TRIVY_VERSION: '0.76.1'
          TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
        run: |
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/trivy.tar.gz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/trivy-bin" reports
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Scan current files for secrets (no secret values uploaded)
        run: trivy fs --scanners secret --skip-dirs .git --exit-code 1 --format json --output /dev/null .
      - name: Scan Dockerfile and Kubernetes configuration
        if: ${{ !cancelled() }}
        run: trivy config --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/iac.json .
      - name: Build local image (no push or deployment)
        if: ${{ !cancelled() }}
        run: docker build --pull -t agentic-ops:security .
      - name: Verify runtime imports and HTTP health without Azure
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -i agentic-ops:security python - <<'PY'
          import os
          import azure.identity, kubernetes, uvicorn
          from unittest.mock import patch
          from fastapi.testclient import TestClient
          os.environ.update(AGENTIC_OPS_NAMESPACE="test-app",
                            AGENTIC_OPS_ALLOWED_REGISTRIES="example.azurecr.io",
                            AGENTIC_OPS_REMEDIATION_TOKEN="offline-smoke-token",
                            AGENTIC_OPS_REMEDIATION_URL="http://remediation.invalid",
                            AZURE_AI_FOUNDRY_ENDPOINT="https://example.invalid",
                            AZURE_AI_FOUNDRY_DEPLOYMENT="offline-smoke")
          from agentic_ops.split_app import build_app
          for role in ("diagnostic", "remediation"):
              os.environ["AGENTIC_OPS_ROLE"] = role
              with patch("kubernetes.config.load_incluster_config"), patch("agentic_ops.aks.AksDiagnosticProvider"), patch("agentic_ops.aks.AksActionExecutor"), patch("agentic_ops.foundry.FoundryDiagnosticProvider"), patch("agentic_ops.acr.AcrRegistry"), patch("agentic_ops.watcher.PodWatcher"):
                  with TestClient(build_app()) as client:
                      response = client.get("/healthz")
                      assert response.status_code == 200
                      assert response.json()["status"] == "ok"
                      if role == "remediation":
                          assert response.json()["role"] == role
          print("Both workload health checks passed as non-root")
          PY
      - name: Scan container (including vulnerabilities without a fix)
        if: ${{ !cancelled() }}
        run: trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output reports/container.json agentic-ops:security
      - name: Generate CycloneDX SBOM
        if: ${{ !cancelled() }}
        run: trivy image --format cyclonedx --output reports/sbom.cdx.json agentic-ops:security
      - name: Preserve reports, including failures
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-and-iac-reports
          path: reports/
          if-no-files-found: error
          retention-days: 14
  gate:
    name: Security gate
    if: ${{ always() }}
    needs: [python, trivy]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every security job to pass
        env:
          PYTHON_RESULT: ${{ needs.python.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
        run: |
          printf 'Python: %s\nTrivy: %s\n' "$PYTHON_RESULT" "$TRIVY_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$PYTHON_RESULT" = success
          test "$TRIVY_RESULT" = success
